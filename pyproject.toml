[project]
name = "dionisio-backend"
version = "0.1.0"
description = "Backend Django/DRF de Dionisio — el juego social cinéfilo."
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15,<3.16",
    "djangorestframework-simplejwt>=5.3,<5.4",
    "django-environ>=0.11,<0.12",
    "django-cors-headers>=4.4,<5.0",
    "django-filter>=24.3,<25.0",
    "django-unfold>=0.40,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "django-storages>=1.14,<2.0",
    "pillow>=11.0,<12.0",
    "requests>=2.32,<3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "pytest-cov>=6.0,<7.0",
    "factory-boy>=3.3,<4.0",
    "responses>=0.25,<1.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "core", "api"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["test_*.py", "tests.py"]
pythonpath = ["src"]
addopts = "--cov=apps --cov-report=term-missing"
